<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Daily Priority Sorter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #fdeef0 0%, #fbdadf 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #601f2a;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .icon { font-size: 2rem; margin-bottom: 4px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #c22f47; font-weight: 800; text-align: center; }
  .subtitle { color: #96525f; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fffafb; border: 1px solid #f8ccd3; border-radius: 16px; padding: 28px 26px; box-shadow: 0 4px 16px rgba(194,47,71,0.08); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #601f2a; }
  textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #f4b6c1;
    background: #fffdfd; color: #601f2a; font-family: inherit; font-size: 1rem; margin-bottom: 18px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: #c22f47; }
  button.action {
    width: 100%; padding: 13px 20px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 700; font-family: inherit; cursor: pointer; background: #c22f47; color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  button.action:hover:not(:disabled) { background: #9f2739; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #96525f; min-height: 1.2em; }
  #resultBox { margin-top: 18px; }
  .task-item { background: #fdf1f3; border: 1px solid #f8ccd3; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; }
  .rank-badge { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: #c22f47; color: #fff; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .task-text { font-weight: 700; color: #601f2a; margin-bottom: 3px; }
  .task-reason { font-size: 0.88rem; color: #7a3d47; }
  .footer-note { color: #96525f; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #f8ccd3;
    border-top-color: #c22f47; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">✅</div>
    <h1>Daily Priority Sorter</h1>
    <p class="subtitle">Paste your messy todo list, get it reordered by urgency. 100% on-device.</p>

    <div class="card">
      <label for="tasksInput">Your todo list (one per line)</label>
      <textarea id="tasksInput" rows="6" placeholder="e.g.&#10;Reply to client email about contract&#10;Water the plants&#10;Fix the production bug reported this morning&#10;Plan next quarter's roadmap"></textarea>
      <button class="action" id="generateBtn">Sort My Priorities</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const tasksInput = document.getElementById('tasksInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const tasks = tasksInput.value.trim();
      if (!tasks) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Sorting by urgency...';

      try {
        const res = await fetch('/api/sort', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tasks }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = data.ranked.map((r, i) => `
          <div class="task-item">
            <div class="rank-badge">${i + 1}</div>
            <div>
              <div class="task-text">${escapeHtml(r.task)}</div>
              ${r.reason ? `<div class="task-reason">${escapeHtml(r.reason)}</div>` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
